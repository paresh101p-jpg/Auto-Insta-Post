name: Auto Instagram Post

on:
  schedule:
    # Runs every day at 15:30 UTC (which is 9:00 PM IST)
    - cron: '30 15 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  post-to-instagram:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Ye permission deni zaroori hai image delete (commit) karne ke liye
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Auto Post Script
        env:
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_SESSION: ${{ secrets.IG_SESSION }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py
